name: Build
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an active release deployment finish; supersede stale branch builds.
  cancel-in-progress: ${{ github.ref != 'refs/heads/releases/v2' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --build-cache --parallel
  dokka:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Dokka
        run: ./gradlew dokkaGenerateHtml --build-cache --parallel
      - name: Upload pages artifact
        if: github.ref == 'refs/heads/releases/v2'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html
  deploy:
    needs: [build, dokka]
    if: github.ref == 'refs/heads/releases/v2'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
